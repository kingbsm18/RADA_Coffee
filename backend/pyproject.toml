[project]
name = "rada-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "alembic>=1.13",
  "psycopg[binary]>=3.1", "pydantic>=2.6", "pydantic-settings>=2.2", "python-multipart",
  "pyjwt>=2.8", "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "jsonschema>=4.20"]
s3 = ["boto3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Errors, pyflakes, import order, bugbear. (Style-only rules are intentionally off.)
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations are meant to be calls in default arguments.
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.File", "fastapi.Header",
]
