services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  backend:
    build: ../backend
    env_file: ../.env
    depends_on: [db]
    volumes: ["../backend:/app", "snapshots:/data/snapshots"]
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  frontend:
    build: ../frontend
    volumes: ["../frontend:/app", "/app/node_modules"]
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
  snapshots:
