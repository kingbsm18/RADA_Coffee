services:

  # ==========================================================
  # FASTAPI — CLOUD BACKEND
  # ==========================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: rada-cloud-backend
    restart: unless-stopped
    init: true

    env_file:
      - ./env/cloud.env

    environment:
      PYTHONUNBUFFERED: "1"

    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

    networks:
      - rada-cloud


  # ==========================================================
  # NEXT.JS — CLOUD DASHBOARD
  # Optional until frontend implementation is complete.
  # ==========================================================
  frontend:
    profiles:
      - dashboard

    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: rada-cloud-frontend
    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

    depends_on:
      backend:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        set -e
        npm run build
        mkdir -p .next/standalone/.next/static .next/standalone/public
        cp -R .next/static/. .next/standalone/.next/static/
        if [ -d public ]; then
          cp -R public/. .next/standalone/public/
        fi
        node .next/standalone/server.js

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - rada-cloud


# ==========================================================
# NETWORKS
# ==========================================================
networks:
  rada-cloud:
    driver: bridge
