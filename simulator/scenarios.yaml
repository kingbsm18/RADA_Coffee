# TODO: scenarios (calm, rush, ambiguous, void, refund)
# RADA AI simulator scenarios
# All timestamps are UTC.
# Bounding boxes use normalized xyxy coordinates.

scenarios:

  # One coffee is handed over and one paid POS item exists.
  calm:
    site_id: cafe-demo
    camera:
      id: sim-camera-01
    model_version: simulator-1.0
    start_at: "2026-11-09T12:00:00Z"
    frame_width: 1280
    frame_height: 720
    fps: 5

    zone:
      name: handover
      direction: in_to_out
      anchor: bottom_center
      polygon:
        - [0.20, 0.20]
        - [0.80, 0.20]
        - [0.80, 0.70]
        - [0.20, 0.70]

    frames:
      - detections:
          - bbox: [0.40, 0.35, 0.60, 0.55]
            class_id: 0
            class_name: coffee_cup
            confidence: 0.96

      - detections:
          - bbox: [0.40, 0.45, 0.60, 0.65]
            class_id: 0
            class_name: coffee_cup
            confidence: 0.96

      - detections:
          - bbox: [0.40, 0.55, 0.60, 0.75]
            class_id: 0
            class_name: coffee_cup
            confidence: 0.95

    pos_sales:
      - external_id: sim-calm-001
        timestamp: "2026-11-09T11:59:30Z"
        product_name: Espresso
        pos_category: coffee
        quantity: 1
        unit_price: "15.00"
        status: paid


